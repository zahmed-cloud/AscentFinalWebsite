<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ascent — Write</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<style>
  :root{--ink:#161619;--ink2:#0f0f12;--bone:#e9e6dc;--red:#8d1c3d;--redt:#c9536f;--dim:rgba(233,230,220,.6);--ld:rgba(233,230,220,.14);--a:'Archivo',sans-serif;--m:'IBM Plex Mono',monospace;--good:#3fb27f}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--a);background:var(--ink);color:var(--bone);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  /* gate */
  .gate{position:fixed;inset:0;z-index:20;background:var(--ink);display:flex;align-items:center;justify-content:center}
  .gatebox{width:340px;text-align:center}
  .gatebox .brand{font-weight:900;font-size:26px;margin-bottom:6px}.gatebox .brand span{color:var(--red)}
  .gatebox p{font-family:var(--m);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:22px}
  .gatebox input{width:100%;background:transparent;border:1px solid var(--ld);border-radius:3px;color:var(--bone);font-family:var(--a);font-size:16px;padding:13px 15px;text-align:center;margin-bottom:12px}
  .gatebox input:focus{outline:none;border-color:var(--redt)}
  .gatebox button{width:100%;background:var(--red);color:#fff;border:none;border-radius:3px;font-family:var(--a);font-weight:700;font-size:15px;padding:13px;cursor:pointer}
  .gate .err{color:var(--redt);font-family:var(--m);font-size:12px;min-height:16px;margin-top:8px}
  /* app */
  header{padding:15px 24px;border-bottom:1px solid var(--ld);display:flex;align-items:center;justify-content:space-between;flex:none}
  header .brand{font-weight:900;font-size:19px}header .brand span{color:var(--red)}
  header .tag{font-family:var(--m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .wrap2{flex:1;display:grid;grid-template-columns:minmax(380px,460px) 1fr;min-height:0}
  .editor{border-right:1px solid var(--ld);overflow-y:auto;padding:24px}
  .field{margin-bottom:18px}
  label{font-family:var(--m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:7px}
  input,select,textarea{width:100%;background:transparent;border:1px solid var(--ld);border-radius:3px;color:var(--bone);font-family:var(--a);font-size:15px;padding:11px 13px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--redt)}
  textarea{min-height:320px;resize:vertical;line-height:1.6;font-size:14.5px}
  .hint{font-family:var(--m);font-size:11px;color:var(--dim);margin-top:6px;line-height:1.5}
  .row{display:flex;gap:12px}.row .field{flex:1}
  .toolbar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .toolbar button{font-family:var(--m);font-size:11px;background:#20202a;border:1px solid var(--ld);color:var(--bone);border-radius:3px;padding:6px 10px;cursor:pointer}
  .toolbar button:hover{border-color:var(--redt)}
  .actions{position:sticky;bottom:0;background:var(--ink);padding:16px 0 4px;border-top:1px solid var(--ld);margin-top:8px}
  .pub{width:100%;background:var(--red);color:#fff;border:none;border-radius:3px;font-family:var(--a);font-weight:700;font-size:15px;padding:15px;cursor:pointer}
  .pub:hover{background:#a3234a}.pub:disabled{opacity:.5;cursor:default}
  .status{font-family:var(--m);font-size:12.5px;line-height:1.5;margin-top:12px;min-height:18px}
  .status.ok{color:var(--good)}.status.bad{color:var(--redt)}
  .status a{color:var(--bone)}
  .prev{overflow-y:auto;background:#000}
  .prev iframe{width:100%;height:100%;border:0;display:block;background:var(--ink)}
  canvas{display:none}
  @media(max-width:900px){.wrap2{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.editor{border-right:none;border-bottom:1px solid var(--ld)}}
</style></head>
<body>
  <div class="gate" id="gate"><div class="gatebox">
    <div class="brand">Ascent<span>.</span></div>
    <p>Private &middot; write &amp; publish</p>
    <input id="gate-pw" type="password" placeholder="Password" autocomplete="current-password">
    <button id="gate-go">Enter</button>
    <div class="err" id="gate-err"></div>
  </div></div>

  <header>
    <span class="brand">Ascent<span>.</span> Write</span>
    <span class="tag">New post</span>
  </header>
  <div class="wrap2">
    <div class="editor">
      <div class="field"><label>Title</label><input id="f-title" placeholder="Booked calls are a number, not a strategy"></div>
      <div class="row">
        <div class="field"><label>Category</label><select id="f-cat"><option>Outbound</option><option>Founder Brand</option><option>GTM Strategy</option><option>Paid</option><option>Ops</option></select></div>
        <div class="field"><label>Date</label><input id="f-date"></div>
      </div>
      <div class="field"><label>Excerpt (one line, the thesis)</label><input id="f-exc" placeholder="How to tell whether your outbound is filling the calendar or just filling the report."></div>
      <div class="field">
        <label>Body</label>
        <div class="toolbar"><button data-ins="## ">H2 heading</button><button data-ins="> ">Quote</button><button data-ins="- ">List item</button></div>
        <textarea id="f-body" placeholder="Write here.

## Headings start with two hashes

Normal paragraphs are just text. Leave a blank line between them.

> A greater-than line becomes a pull quote.

- A dash line becomes a bullet"></textarea>
        <div class="hint">blank line = new paragraph &middot; "## " = heading &middot; "&gt; " = quote &middot; "- " = bullet. Aim 600 to 900 words. Draft auto-saves in this browser.</div>
      </div>
      <div class="actions">
        <button class="pub" id="publish">Publish to website</button>
        <div class="status" id="status"></div>
      </div>
    </div>
    <div class="prev"><iframe id="preview"></iframe></div>
  </div>
  <canvas id="cv" width="1600" height="1000"></canvas>
<script>
const $=id=>document.getElementById(id);
let PW="";
function slugify(t){return t.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'untitled';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function mdBody(src){
  return src.replace(/\r/g,'').split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean).map(b=>{
    const l=b.split('\n').map(x=>x.trim());
    if(l[0].startsWith('## ')) return '    <h2>'+esc(l[0].slice(3))+'</h2>';
    if(l.every(x=>x.startsWith('- '))) return '    <ul>\n'+l.map(x=>'      <li>'+esc(x.slice(2))+'</li>').join('\n')+'\n    </ul>';
    if(l[0].startsWith('> ')) return '    <blockquote>'+esc(l.map(x=>x.replace(/^>\s?/,'')).join(' '))+'</blockquote>';
    return '    <p>'+esc(l.join(' '))+'</p>';
  }).join('\n');
}
function toISO(d){const m={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
  const p=(d||'').toLowerCase().match(/(\d{1,2})\s+([a-z]{3})[a-z]*\s+(\d{4})/);return p?p[3]+'-'+(m[p[2]]||'01')+'-'+p[1].padStart(2,'0'):'2026-01-01';}
function drawCover(){const c=$('cv'),x=c.getContext('2d'),slug=slugify($('f-title').value),cat=$('f-cat').value;
  x.fillStyle='#161619';x.fillRect(0,0,1600,1000);
  x.strokeStyle='rgba(233,230,220,.05)';x.lineWidth=2;for(let i=1;i<8;i++){x.beginPath();x.moveTo(i*200,0);x.lineTo(i*200,1000);x.stroke();}
  x.fillStyle='#8d1c3d';x.fillRect(80,80,40,40);
  x.fillStyle='#c9536f';x.font='500 30px "IBM Plex Mono",monospace';x.fillText(cat.toUpperCase(),140,112);
  let seed=0;for(const ch of slug)seed=(seed*31+ch.charCodeAt(0))>>>0;const rnd=()=>{seed=(seed*1103515245+12345)>>>0;return (seed%1000)/1000;};
  const cols=['#e9e6dc','#8d1c3d','#c9536f'];for(let i=0;i<6;i++){x.fillStyle=cols[i%3];x.globalAlpha=1-i*0.13;x.fillRect(80,300+i*105,300+rnd()*1000,64);}
  x.globalAlpha=1;x.fillStyle='#e9e6dc';x.font='900 40px "Archivo",sans-serif';x.textAlign='right';x.fillText('Ascent',1520,940);
  x.fillStyle='#8d1c3d';x.fillRect(1526,908,32,32);x.textAlign='left';
  return c.toDataURL('image/png');
}
function fields(){const title=$('f-title').value||'Untitled post';return{title,category:$('f-cat').value,date:$('f-date').value,iso:toISO($('f-date').value),excerpt:$('f-exc').value,slug:slugify(title),bodyHTML:mdBody($('f-body').value)};}
function preview(){const f=fields();
  const html=`<!doctype html><html><head><base href="${location.href.replace(/[^/]*$/,'')}"><link rel="stylesheet" href="css/styles.css"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"></head><body>
  <main><section class="phero"><div class="wrap"><div class="top"><span class="ey"><span class="sq"></span>&nbsp; ${esc(f.category.toUpperCase())}</span><span class="ey">Est. 2022 — USA / UK / UAE / AU / EU</span></div>
  <h1>${esc(f.title)}</h1><p class="mono" style="font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-top:22px">By Jamil Ahmed &middot; ${esc(f.category)} &middot; ${esc(f.date)}</p></div></section>
  <section><div class="wrap"><article class="prose" style="margin-top:20px">${f.bodyHTML}</article></div></section></main></body></html>`;
  $('preview').srcdoc=html;
}
// draft persistence
function save(){localStorage.setItem('ascent-draft',JSON.stringify({t:$('f-title').value,c:$('f-cat').value,d:$('f-date').value,e:$('f-exc').value,b:$('f-body').value}));}
function restore(){try{const x=JSON.parse(localStorage.getItem('ascent-draft')||'{}');if(x.t)$('f-title').value=x.t;if(x.c)$('f-cat').value=x.c;if(x.e)$('f-exc').value=x.e;if(x.b)$('f-body').value=x.b;if(x.d)$('f-date').value=x.d;}catch(e){}}
['f-title','f-cat','f-date','f-exc','f-body'].forEach(id=>$(id).addEventListener('input',()=>{preview();save();}));
document.querySelectorAll('.toolbar button').forEach(bn=>bn.addEventListener('click',()=>{const ta=$('f-body'),ins=bn.dataset.ins,s=ta.selectionStart;ta.value=ta.value.slice(0,s)+ins+ta.value.slice(s);ta.focus();ta.selectionStart=ta.selectionEnd=s+ins.length;preview();save();}));

// gate
function openGate(){$('gate-pw').focus();}
$('gate-go').addEventListener('click',()=>{const v=$('gate-pw').value;if(!v){$('gate-err').textContent='Enter your password.';return;}PW=v;$('gate').style.display='none';});
$('gate-pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('gate-go').click();});

// publish
$('publish').addEventListener('click',async()=>{
  const f=fields();const st=$('status');
  if(!f.title||f.title==='Untitled post'){st.className='status bad';st.textContent='Add a title first.';return;}
  if(!$('f-body').value.trim()){st.className='status bad';st.textContent='Write something first.';return;}
  $('publish').disabled=true;st.className='status';st.textContent='Publishing… this takes about a minute to go live.';
  try{
    const body={password:PW,...f,coverBase64:drawCover()};
    const r=await fetch('/api/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok){throw new Error(j.error||('Error '+r.status));}
    st.className='status ok';st.innerHTML='Published. Live in ~1 min at <a href="'+j.url+'" target="_blank" rel="noopener">'+j.url.replace('https://','')+'</a>. You can write another.';
    localStorage.removeItem('ascent-draft');
    ['f-title','f-exc','f-body'].forEach(id=>$(id).value='');preview();
  }catch(e){st.className='status bad';st.textContent=String(e.message||e);}
  $('publish').disabled=false;
});

// init
(function(){const d=new Date(),mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];$('f-date').value=d.getDate()+' '+mo[d.getMonth()]+' '+d.getFullYear();})();
restore();openGate();document.fonts.ready.then(preview);preview();
</script>
</body></html>
