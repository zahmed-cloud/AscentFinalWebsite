<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ascent — Blog Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#161619;--ink2:#0f0f12;--bone:#e9e6dc;--red:#8d1c3d;--redt:#c9536f;--dim:rgba(233,230,220,.6);--ld:rgba(233,230,220,.14);--a:'Archivo',sans-serif;--m:'IBM Plex Mono',monospace}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--a);background:var(--ink);color:var(--bone);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{padding:16px 24px;border-bottom:1px solid var(--ld);display:flex;align-items:center;justify-content:space-between;flex:none}
  header .brand{font-weight:900;font-size:20px}header .brand span{color:var(--red)}
  header .tag{font-family:var(--m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .wrap2{flex:1;display:grid;grid-template-columns:minmax(380px,460px) 1fr;min-height:0}
  .editor{border-right:1px solid var(--ld);overflow-y:auto;padding:24px}
  .field{margin-bottom:18px}
  label{font-family:var(--m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:7px}
  input,select,textarea{width:100%;background:transparent;border:1px solid var(--ld);border-radius:3px;color:var(--bone);font-family:var(--a);font-size:15px;padding:11px 13px}
  input:focus,select,textarea:focus{outline:none;border-color:var(--redt)}
  select{font-family:var(--a)}
  textarea{min-height:340px;resize:vertical;line-height:1.6;font-size:14.5px}
  .hint{font-family:var(--m);font-size:11px;color:var(--dim);margin-top:6px;line-height:1.5}
  .row{display:flex;gap:12px}.row .field{flex:1}
  .toolbar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .toolbar button{font-family:var(--m);font-size:11px;letter-spacing:.04em;background:#20202a;border:1px solid var(--ld);color:var(--bone);border-radius:3px;padding:6px 10px;cursor:pointer}
  .toolbar button:hover{border-color:var(--redt)}
  .actions{position:sticky;bottom:0;background:var(--ink);padding:16px 0 4px;border-top:1px solid var(--ld);margin-top:8px;display:flex;flex-direction:column;gap:9px}
  .btn{font-family:var(--a);font-weight:700;font-size:14px;border-radius:3px;padding:13px 18px;cursor:pointer;border:none;text-align:left}
  .btn.red{background:var(--red);color:#fff}.btn.red:hover{background:#a3234a}
  .btn.g{background:transparent;color:var(--bone);border:1px solid var(--ld)}.btn.g:hover{border-color:var(--bone)}
  .prev{overflow-y:auto;background:#000}
  .prev iframe{width:100%;height:100%;border:0;display:block;background:var(--ink)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--red);color:#fff;font-family:var(--m);font-size:13px;padding:11px 22px;border-radius:3px;transition:transform .25s;z-index:9}
  .toast.show{transform:translateX(-50%) translateY(0)}
  canvas{display:none}
  @media(max-width:900px){.wrap2{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.editor{border-right:none;border-bottom:1px solid var(--ld)}}
</style></head>
<body>
  <header>
    <span class="brand">Ascent<span>.</span> Blog Studio</span>
    <span class="tag">Write &middot; preview &middot; export &middot; publish</span>
  </header>
  <div class="wrap2">
    <div class="editor">
      <div class="field"><label>Title</label><input id="f-title" placeholder="Booked calls are a number, not a strategy"></div>
      <div class="row">
        <div class="field"><label>Category</label><select id="f-cat"><option>Outbound</option><option>Founder Brand</option><option>GTM Strategy</option><option>Paid</option><option>Ops</option></select></div>
        <div class="field"><label>Date</label><input id="f-date" placeholder="27 Jul 2026"></div>
      </div>
      <div class="field"><label>Excerpt (one line, the thesis)</label><input id="f-exc" placeholder="How to tell whether your outbound is filling the calendar or just filling the report."></div>
      <div class="field">
        <label>Body</label>
        <div class="toolbar">
          <button data-ins="## ">H2 heading</button>
          <button data-ins="> ">Quote</button>
          <button data-ins="- ">List item</button>
        </div>
        <textarea id="f-body" placeholder="Write here. Simple rules:

## A heading line starts with two hashes

A normal paragraph is just text. Leave a blank line between paragraphs.

> A line starting with a greater-than sign becomes a pull quote.

- A line starting with a dash becomes a bullet
- Add as many as you like"></textarea>
        <div class="hint">Rules: blank line = new paragraph &middot; "## " = heading &middot; "&gt; " = pull quote &middot; "- " = bullet. Aim for 600 to 900 words, one quote, one list.</div>
      </div>
      <div class="field"><label>Slug (auto)</label><input id="f-slug" readonly></div>
      <div class="actions">
        <button class="btn red" id="dl-article">1 &nbsp;Download article file</button>
        <button class="btn g" id="dl-cover">2 &nbsp;Download cover image</button>
        <button class="btn g" id="cp-card">3 &nbsp;Copy blog-index card</button>
        <button class="btn g" id="cp-map">4 &nbsp;Copy sitemap line</button>
      </div>
    </div>
    <div class="prev"><iframe id="preview"></iframe></div>
  </div>
  <div class="toast" id="toast"></div>
  <canvas id="cv" width="1600" height="1000"></canvas>
<script>
const TEMPLATE = "<!doctype html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>%%TITLE%% \u2014 Ascent</title>\n<meta name=\"description\" content=\"%%DESC%%\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<link rel=\"stylesheet\" href=\"css/styles.css\">\n<link rel=\"icon\" type=\"image/svg+xml\" href=\"assets/favicon.svg\">\n<link rel=\"canonical\" href=\"https://getascent.co/article-%%SLUG%%.html\">\n<meta property=\"og:type\" content=\"article\">\n<meta property=\"article:published_time\" content=\"%%ISO%%\">\n<meta property=\"og:site_name\" content=\"Ascent\">\n<meta property=\"og:title\" content=\"%%TITLE%% \u2014 Ascent\">\n<meta property=\"og:description\" content=\"%%DESC%%\">\n<meta property=\"og:url\" content=\"https://getascent.co/article-%%SLUG%%.html\">\n<meta property=\"og:image\" content=\"https://getascent.co/assets/blog/%%SLUG%%.png\">\n<meta property=\"og:image:width\" content=\"1600\"><meta property=\"og:image:height\" content=\"1000\">\n<meta name=\"twitter:card\" content=\"summary_large_image\">\n<meta name=\"twitter:title\" content=\"%%TITLE%% \u2014 Ascent\">\n<meta name=\"twitter:description\" content=\"%%DESC%%\">\n<meta name=\"twitter:image\" content=\"https://getascent.co/assets/blog/%%SLUG%%.png\">\n<meta name=\"theme-color\" content=\"#161619\">\n<script type=\"application/ld+json\">{\"@context\":\"https://schema.org\",\"@type\":\"BlogPosting\",\"headline\":\"%%TITLE%%\",\"description\":\"%%DESC%%\",\"datePublished\":\"%%ISO%%\",\"dateModified\":\"%%ISO%%\",\"author\":{\"@type\":\"Person\",\"name\":\"Jamil Ahmed\",\"url\":\"https://www.linkedin.com/in/getascent/\"},\"publisher\":{\"@type\":\"Organization\",\"name\":\"Ascent\"},\"image\":\"https://getascent.co/assets/blog/%%SLUG%%.png\",\"mainEntityOfPage\":\"https://getascent.co/article-%%SLUG%%.html\",\"url\":\"https://getascent.co/article-%%SLUG%%.html\"}<\/script>\n</head>\n<body>\n\n<nav><div class=\"wrap navin\">\n  <a class=\"brand\" href=\"index.html\">Ascent<span class=\"sq\"></span></a>\n  <div class=\"nl\">\n    <div class=\"nl-item has-mega\">\n      <a href=\"services.html\" aria-haspopup=\"true\" aria-expanded=\"false\">Services <span class=\"mcaret\">&#9662;</span></a>\n      <div class=\"mega\"><div class=\"wrap mega-in\">\n        <div class=\"mega-intro\">\n          <div class=\"mega-ih\">View all services</div>\n          <p>Take one service standalone, or run the whole engine.</p>\n          <a class=\"mega-all\" href=\"services.html\">See all services <span class=\"arrow\">&#8594;</span></a>\n        </div>\n        <div class=\"mega-col\">\n          <div class=\"mega-h\">Infrastructure</div>\n          <a class=\"mega-link\" href=\"services.html#s1\"><b>GTM Strategy &amp; Foundation</b><span>ICP, positioning, and the 90-day roadmap</span></a>\n          <a class=\"mega-link\" href=\"services.html#s6\"><b>Marketing Ops &amp; Automation</b><span>CRM, workflows, and dashboards that connect it all</span></a>\n        </div>\n        <div class=\"mega-col\">\n          <div class=\"mega-h\">Pipeline</div>\n          <a class=\"mega-link\" href=\"services.html#s2\"><b>Outbound &amp; Pipeline</b><span>Multi-channel outbound that books qualified calls weekly</span></a>\n          <a class=\"mega-link\" href=\"services.html#s4\"><b>Paid Ads</b><span>LinkedIn and Google campaigns that create and capture demand</span></a>\n        </div>\n        <div class=\"mega-col\">\n          <div class=\"mega-h\">Authority</div>\n          <a class=\"mega-link\" href=\"services.html#s3\"><b>Founder LinkedIn Ghostwriting</b><span>Turn your LinkedIn into an authority asset</span></a>\n          <a class=\"mega-link\" href=\"services.html#s5\"><b>Website, Landing Pages &amp; CRO</b><span>Sites and pages built to convert visitors into leads</span></a>\n        </div>\n      </div></div>\n    </div>\n    <a href=\"industries.html\">Industries</a>\n    <a href=\"about.html\">About</a>\n    <a href=\"results.html\">Case studies</a>\n    <a href=\"blog.html\" class=\"active\">Blog</a>\n  </div>\n  <span class=\"navr\">\n    <a class=\"btn red\" href=\"https://calendar.app.google/dSXTygaF9UpKiNyh7\" target=\"_blank\" rel=\"noopener\">Book a call <span class=\"arrow\">&#8594;</span></a>\n    <button class=\"burger\" aria-label=\"Menu\" aria-expanded=\"false\">Menu</button>\n  </span>\n</div></nav>\n\n<main>\n<section class=\"phero\"><div class=\"wrap\">\n  <div class=\"top\" data-r><span class=\"ey\"><span class=\"sq\"></span>&nbsp; %%CATU%%</span><span class=\"ey\">Est. 2022 &mdash; USA / UK / UAE / AU / EU</span></div>\n  <h1 data-r>%%TITLE%%</h1>\n  <p class=\"mono\" data-r style=\"font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-top:22px\">By Jamil Ahmed &middot; %%CAT%% &middot; %%DATE%%</p>\n</div></section>\n\n<section><div class=\"wrap\">\n  <img src=\"assets/blog/%%SLUG%%.png\" alt=\"%%TITLE%%\" width=\"1600\" height=\"1000\" style=\"width:100%;border-radius:3px;display:block\" data-r>\n  <article class=\"prose\" data-r style=\"margin-top:44px\">\n%%BODY%%\n  </article>\n</div></section>\n</main>\n\n<section class=\"ctaband\" id=\"book\"><div class=\"wrap\">\n  <h2 data-r>Let's get your pipeline moving.</h2>\n  <a class=\"btn bone\" href=\"https://calendar.app.google/dSXTygaF9UpKiNyh7\" target=\"_blank\" rel=\"noopener\" data-r>Book a call <span class=\"arrow\">&#8594;</span></a>\n</div></section>\n\n<footer><div class=\"wrap\">\n  <div class=\"fgrid\">\n    <div class=\"fbrand\">\n      <a class=\"brand\" href=\"index.html\">Ascent<span class=\"sq\"></span></a>\n      <p>Pipeline, authority and infrastructure for B2B. One system, one point of accountability.</p>\n    </div>\n    <div class=\"fcol\">\n      <h4>Company</h4>\n      <a href=\"services.html\">Services</a>\n      <a href=\"industries.html\">Industries</a>\n      <a href=\"about.html\">About</a>\n      <a href=\"results.html\">Case studies</a>\n      <a href=\"how-we-work.html\">How we work</a>\n      <a href=\"blog.html\">Blog</a>\n    </div>\n    <div class=\"fcol\">\n      <h4>Get in touch</h4>\n      \n      <a href=\"mailto:jamil@getascent.co\">jamil@getascent.co</a>\n      <a href=\"https://www.linkedin.com/in/getascent/\">LinkedIn</a>\n    </div>\n    <div class=\"fcol\">\n      <h4>Coverage</h4>\n      <p>USA &middot; UK &middot; UAE</p>\n      <p>Australia &middot; Europe</p>\n    </div>\n  </div>\n  <div class=\"fbot\"><span>&copy; 2026 Ascent&#9642; &mdash; getascent.co</span><span class=\"fbot-legal\"><a href=\"privacy.html\">Privacy</a> &middot; <a href=\"terms.html\">Terms</a></span><span>B2B GTM &amp; Outbound</span></div>\n</div></footer>\n\n<script src=\"js/script.js\"><\/script>\n</body></html>\n";
const $=id=>document.getElementById(id);
function slugify(t){return t.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'untitled';}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function mdBody(src){
  const blocks=src.replace(/\r/g,'').split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  return blocks.map(b=>{
    const lines=b.split('\n').map(l=>l.trim());
    if(lines[0].startsWith('## ')) return '    <h2>'+esc(lines[0].slice(3))+'</h2>';
    if(lines.every(l=>l.startsWith('- '))) return '    <ul>\n'+lines.map(l=>'      <li>'+esc(l.slice(2))+'</li>').join('\n')+'\n    </ul>';
    if(lines[0].startsWith('> ')) return '    <blockquote>'+esc(lines.map(l=>l.replace(/^>\s?/,'')).join(' '))+'</blockquote>';
    return '    <p>'+esc(lines.join(' '))+'</p>';
  }).join('\n');
}
function build(){
  const title=$('f-title').value||'Untitled post';
  const cat=$('f-cat').value, date=$('f-date').value||'', exc=$('f-exc').value||'';
  const slug=slugify(title); $('f-slug').value=slug;
  const iso=toISO(date);
  let html=TEMPLATE
    .split('%%TITLE%%').join(esc(title))
    .split('%%DESC%%').join(esc(exc))
    .split('%%SLUG%%').join(slug)
    .split('%%CATU%%').join(cat.toUpperCase())
    .split('%%CAT%%').join(cat)
    .split('%%DATE%%').join(esc(date))
    .split('%%ISO%%').join(iso)
    .split('%%BODY%%').join(mdBody($('f-body').value));
  return {html,slug,title,cat,date,exc};
}
function toISO(d){ // "27 Jul 2026" -> 2026-07-27, best effort
  const m={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
  const p=d.toLowerCase().match(/(\d{1,2})\s+([a-z]{3})[a-z]*\s+(\d{4})/);
  if(p) return p[3]+'-'+(m[p[2]]||'01')+'-'+p[1].padStart(2,'0');
  return '2026-01-01';
}
function preview(){
  const {html}=build();
  const base=location.href.replace(/[^/]*$/,''); // folder of this file
  $('preview').srcdoc=html.replace('</head>','<base href="'+base+'"></head>');
}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1400);}
function download(name,text){const b=new Blob([text],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();}
['f-title','f-cat','f-date','f-exc','f-body'].forEach(id=>$(id).addEventListener('input',preview));
document.querySelectorAll('.toolbar button').forEach(b=>b.addEventListener('click',()=>{
  const ta=$('f-body');const ins=b.dataset.ins;const s=ta.selectionStart;
  ta.value=ta.value.slice(0,s)+ins+ta.value.slice(s);ta.focus();ta.selectionStart=ta.selectionEnd=s+ins.length;preview();}));
$('dl-article').addEventListener('click',()=>{const {html,slug}=build();download('article-'+slug+'.html',html);toast('Saved article-'+slug+'.html');});
$('cp-card').addEventListener('click',()=>{const {slug,title,cat,date,exc}=build();
  const card='    <a class="bcard" href="article-'+slug+'.html" data-r>\n      <img class="thumb" src="assets/blog/'+slug+'.png" alt="'+esc(title)+'" loading="lazy" width="1600" height="1000">\n      <div class="bc"><span class="cat">'+cat+'</span><h2>'+esc(title)+'</h2><p>'+esc(exc)+'</p><div class="meta">'+cat+' &middot; '+esc(date)+'</div></div>\n    </a>';
  navigator.clipboard.writeText(card);toast('Blog card copied, paste at top of .bcards in blog.html');});
$('cp-map').addEventListener('click',()=>{const {slug}=build();
  navigator.clipboard.writeText('  <url><loc>https://getascent.co/article-'+slug+'.html</loc><lastmod>2026-01-01</lastmod></url>');
  toast('Sitemap line copied');});
$('dl-cover').addEventListener('click',()=>{drawCover();});
function drawCover(){
  const {slug,cat}=build();const c=$('cv');const x=c.getContext('2d');
  x.fillStyle='#161619';x.fillRect(0,0,1600,1000);
  // faint grid
  x.strokeStyle='rgba(233,230,220,.05)';x.lineWidth=2;for(let i=1;i<8;i++){x.beginPath();x.moveTo(i*200,0);x.lineTo(i*200,1000);x.stroke();}
  x.fillStyle='#8d1c3d';x.fillRect(80,80,40,40);
  x.fillStyle='#c9536f';x.font='500 30px "IBM Plex Mono",monospace';x.fillText(cat.toUpperCase(),140,112);
  // seeded bars
  let seed=0;for(const ch of slug)seed=(seed*31+ch.charCodeAt(0))>>>0;
  const rnd=()=>{seed=(seed*1103515245+12345)>>>0;return (seed%1000)/1000;};
  const cols=['#e9e6dc','#8d1c3d','#c9536f'];
  for(let i=0;i<6;i++){const w=300+rnd()*1000;x.fillStyle=cols[i%3];x.globalAlpha=1-i*0.13;x.fillRect(80,300+i*105,w,64);}
  x.globalAlpha=1;
  x.fillStyle='#e9e6dc';x.font='900 40px "Archivo",sans-serif';x.textAlign='right';x.fillText('Ascent',1520,940);
  x.fillStyle='#8d1c3d';x.fillRect(1526,908,32,32);x.textAlign='left';
  c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=slug+'.png';a.click();toast('Saved '+slug+'.png, put it in assets/blog/');});
}
// init date to today
(function(){const d=new Date();const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];$('f-date').value=d.getDate()+' '+mo[d.getMonth()]+' '+d.getFullYear();})();
document.fonts.ready.then(preview); preview();
</script>
</body></html>
